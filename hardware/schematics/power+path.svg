<svg xmlns="http://www.w3.org/2000/svg" viewBox="-76 -7 780 377" width="780" height="377" class="sch"><style>
.sch{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:11px}
.bg{fill:#ffffff}
.w,.n,.x{fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.w{stroke:#1f2630}.n{stroke:#c2185b}.x{stroke:#9aa1a9;stroke-dasharray:4 3}
.f.w{fill:#1f2630}.f.n{fill:#c2185b}.f.x{fill:#9aa1a9}
.o{fill:#ffffff}.box{fill:none}
.t{fill:#1f2630;stroke:none}.nt{fill:#c2185b}.xt{fill:#9aa1a9;text-decoration:line-through}.dim,.pin{fill:#5d6673}
@media (prefers-color-scheme: dark){
.bg,.o{fill:#0d1117}
.w{stroke:#dbe1e8}.f.w{fill:#dbe1e8}.t{fill:#dbe1e8}.dim,.pin{fill:#98a2ae}
.n{stroke:#f06a9b}.f.n{fill:#f06a9b}.nt{fill:#f06a9b}
}
</style><rect class="bg" x="-76" y="-7" width="780" height="377" rx="6"/><circle class="w o" cx="40" cy="60" r="3.5"/><text class="t" x="32" y="64" text-anchor="end"><tspan x="32" dy="0">J1 5V DC</tspan><tspan x="32" dy="13">barrel +</tspan></text><polyline class="w" points="40,60 66.0,60.0"/><polyline class="w" points="94.0,60.0 120,60"/><g transform="translate(80.0,60.0) rotate(0)"><rect class="w" x="-14" y="-5" width="28" height="10" fill="none"/><line class="w" x1="-14" y1="0" x2="14" y2="0"/></g><text class="t" x="80.0" y="46.0" text-anchor="middle"><tspan x="80.0" dy="0">F1 2A</tspan></text><polyline class="w" points="120,60 148.0,60.0"/><polyline class="w" points="172.0,60.0 200,60"/><g transform="translate(160.0,60.0) rotate(0)"><circle class="w o" cx="-12" cy="0" r="2.5"/><circle class="w o" cx="12" cy="0" r="2.5"/><line class="w" x1="-10" y1="-1" x2="12" y2="-10"/></g><text class="t" x="160.0" y="20.0" text-anchor="middle"><tspan x="160.0" dy="0">SW_PWR toggle</tspan><tspan x="160.0" dy="13">(2-pin JST; jumpered</tspan><tspan x="160.0" dy="13">until wired)</tspan></text><rect class="n box" x="214" y="44" width="100" height="32" rx="3"/><text class="t nt" x="264.0" y="91" text-anchor="middle"><tspan x="264.0" dy="0">power path (KiCad v1)</tspan></text><polyline class="n" points="200,60 214,60"/><polyline class="n" points="314,60 340,60"/><polyline class="w" points="340,60 400,60 400,260"/><text class="t" x="350" y="50" text-anchor="start"><tspan x="350" dy="0">+5V</tspan></text><circle class="w f" cx="400" cy="90" r="3"/><polyline class="w" points="400,90 450,90"/><circle class="w o" cx="450" cy="90" r="3.5"/><text class="t" x="458" y="94" text-anchor="start"><tspan x="458" dy="0">Mega 5V pin (not VIN)</tspan></text><circle class="w f" cx="400" cy="124" r="3"/><polyline class="w" points="400,124 450,124"/><circle class="w o" cx="450" cy="124" r="3.5"/><text class="t" x="458" y="128" text-anchor="start"><tspan x="458" dy="0">U3 LM386 module VCC</tspan></text><circle class="w f" cx="400" cy="158" r="3"/><polyline class="w" points="400,158 450,158"/><circle class="w o" cx="450" cy="158" r="3.5"/><text class="t" x="458" y="162" text-anchor="start"><tspan x="458" dy="0">J_FP 24 → OLED VCC, button ladder R1</tspan></text><circle class="w f" cx="400" cy="192" r="3"/><polyline class="w" points="400,192 450,192"/><circle class="w o" cx="450" cy="192" r="3.5"/><text class="t" x="458" y="196" text-anchor="start"><tspan x="458" dy="0">J_LB 3 → M1 source (ESP32 latch)</tspan></text><circle class="w f" cx="400" cy="226" r="3"/><polyline class="w" points="400,226 450,226"/><circle class="w o" cx="450" cy="226" r="3.5"/><text class="t" x="458" y="230" text-anchor="start"><tspan x="458" dy="0">J_LB 9 → WPM pot</tspan></text><circle class="w f" cx="400" cy="260" r="3"/><polyline class="w" points="400,260 450,260"/><circle class="w o" cx="450" cy="260" r="3.5"/><text class="t" x="458" y="264" text-anchor="start"><tspan x="458" dy="0">J_LB 8 → Farnsworth pot</tspan></text><circle class="w o" cx="40" cy="130" r="3.5"/><text class="t" x="32" y="134" text-anchor="end"><tspan x="32" dy="0">J1 −</tspan></text><polyline class="w" points="40,130 80,130"/><polyline class="w" points="80,130 80,138"/><polyline class="w" points="70,138.0 90,138.0"/><polyline class="w" points="74,141.5 86,141.5"/><polyline class="w" points="78,145.0 82,145.0"/><text class="t dim" x="-60" y="320" text-anchor="start"><tspan x="-60" dy="0">One ground for everything. The ESP32 is the only load not on +5V: it runs from the latch (+5V_LATCHED via JP1).</tspan></text><text class="t dim" x="-60" y="336" text-anchor="start"><tspan x="-60" dy="0">Rule for v0: barrel off while the Mega is on USB (USB 5V and +5V would be tied through the Mega).</tspan></text><text class="t dim" x="-60" y="352" text-anchor="start"><tspan x="-60" dy="0">KiCad v1: an ideal-diode / power-path stage so the barrel supply and USB can never feed each other.</tspan></text></svg>